[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imoveis-jp"
version = "0.1.0"
description = "Projeto de Paradigmas de Aprendizagem de Máquina — imóveis de João Pessoa"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# requirements.txt continua sendo a única fonte de verdade das dependências.
[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
